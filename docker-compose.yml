version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vms_db
      POSTGRES_USER: vms_user
      POSTGRES_PASSWORD: vms_pass
    ports:
      - '5432:5432'
    volumes:
      - vms_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vms_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    container_name: vms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - vms_minio_data:/data

volumes:
  vms_pg_data:
  vms_minio_data:
